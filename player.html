<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zing Video Player</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #334155; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        iframe { width: 100%; height: 250px; border-radius: 10px; border: none; margin-bottom: 20px; }
        .video-item { background: #1e293b; padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #ef4444; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h3>Playlist (<span id="count">0</span>/50)</h3>
    <div id="playerContainer" style="display:none;">
        <iframe id="mainPlayer" src="" allowfullscreen></iframe>
    </div>
    <input type="text" id="title" placeholder="Video Title">
    <input type="text" id="url" placeholder="YouTube, FB, or Insta URL">
    <button onclick="pushLink()">Add Video</button>
    <div id="videoList" style="margin-top: 20px;"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDg-_--DQoINvqsMOAYfbwEnDyvMgH88-w",
        authDomain: "zing-arena.firebaseapp.com",
        databaseURL: "https://zing-arena-default-rtdb.firebaseio.com",
        projectId: "zing-arena",
        storageBucket: "zing-arena.firebasestorage.app",
        messagingSenderId: "749170646467",
        appId: "1:749170646467:web:1d279de6a84a0340bcf176"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
        if(user) loadData(user.uid);
        else alert("Bhai, pehle login kar!");
    });

    function pushLink() {
        const title = document.getElementById('title').value;
        const url = document.getElementById('url').value;
        const uid = auth.currentUser.uid;
        const playlistRef = db.ref('users/' + uid + '/playlist/');

        playlistRef.once('value', snapshot => {
            if(snapshot.numChildren() >= 50) {
                alert("Limit full hai (Max 50)!");
                return;
            }

            let finalUrl = url;
            // YouTube Handler
            if (url.includes("youtube.com") || url.includes("youtu.be")) {
                let id = url.split(/(vi\/|v=|\/v\/|youtu\.be\/|\/embed\/|\/shorts\/)/);
                finalUrl = "https://www.youtube.com/embed/" + (id[2] ? id[2].split(/[^0-9a-z_-]/i)[0] : url);
            }

            playlistRef.push({ title: title || "New Video", url: finalUrl });
            document.getElementById('title').value = "";
            document.getElementById('url').value = "";
        });
    }

    function playVideo(url) {
        document.getElementById('playerContainer').style.display = "block";
        document.getElementById('mainPlayer').src = url;
    }

    function deleteVideo(key) { db.ref('users/' + auth.currentUser.uid + '/playlist/' + key).remove(); }

    function loadData(uid) {
        db.ref('users/' + uid + '/playlist/').on('value', snapshot => {
            const list = document.getElementById('videoList');
            list.innerHTML = "";
            document.getElementById('count').innerText = snapshot.numChildren();
            snapshot.forEach(child => {
                const data = child.val();
                list.innerHTML += `<div class="video-item">
                    <span>${data.title}</span> 
                    <div>
                        <button onclick="playVideo('${data.url}')" style="width:auto; padding:5px 10px;">Play</button>
                        <span class="delete-btn" onclick="deleteVideo('${child.key}')">X</span>
                    </div>
                </div>`;
            });
        });
    }
</script>
</body>
</html>
